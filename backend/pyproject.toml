[project]
name = "zxb-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.33",
  "sqlalchemy[asyncio]==2.1.8",
  "asyncpg==0.32.0",
  "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: full bot-auction simulations (npm run test:full)"]
