    <script>
      // Hide cards before first paint only when the matrix will build them; give up after 3 s.
      (function () {
        var p = location.pathname.replace(/\/+$/, '') || '/'
        if ((p === '/' || p === '/draft' || p === '/auction') && !matchMedia('(prefers-reduced-motion: reduce)').matches && window.WebGL2RenderingContext) {
          var r = document.documentElement
          r.classList.add('fx')
          setTimeout(function () { if (!r.classList.contains('gl')) r.classList.remove('fx') }, 3000)
        }
      })()
