<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>ZenithXBeans · Community Tournaments</title>
    <meta name="description" content="Community tournaments hosted by ZenithXBeans. First up: the Valorant Draft, a live player auction. ₹300 entry." />
    <meta property="og:title" content="ZenithXBeans · Community Tournaments" />
    <meta property="og:description" content="First up: the Valorant Draft. Lead a team or get drafted in a live auction. ₹300 entry." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..800&family=Silkscreen&display=swap" rel="stylesheet" />
    <script>
      // Hide cards before first paint only when the matrix will build them; give up after 3 s.
      (function () {
        var p = location.pathname.replace(/\/+$/, '') || '/'
        if ((p === '/' || p === '/draft') && !matchMedia('(prefers-reduced-motion: reduce)').matches && window.WebGL2RenderingContext) {
          var r = document.documentElement
          r.classList.add('fx')
          setTimeout(function () { if (!r.classList.contains('gl')) r.classList.remove('fx') }, 3000)
        }
      })()
    </script>
  </head>
  <body>
    <div class="band" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
